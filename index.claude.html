<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén - Productos</title>
  <link rel="stylesheet" href="style.css">

  <!-- 1. Librería de Supabase (tiene que ir antes que conexion.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container">
    <h1>Almacén</h1>

    <!-- Formulario -->
    <div class="card">
      <h2 id="form-title">Agregar Nuevo Producto</h2>

      <form id="product-form">
        <input type="hidden" id="product-id">

        <div class="form-grid">
          <input type="text" id="nombre" placeholder="Nombre" required>
          <input type="text" id="categoria" placeholder="Categoría">
          <input type="number" id="precio" placeholder="Precio" step="0.01" min="0" required>
          <input type="number" id="stock" placeholder="Stock" min="0" required>
        </div>

        <button type="submit" id="btn-submit">Guardar Producto</button>
        <button type="button" id="btn-cancel" class="btn-cancel" style="display:none;" onclick="resetForm()">Cancelar</button>
      </form>
    </div>

    <!-- Tabla de productos -->
    <div class="card">
      <h2>Lista de productos</h2>

      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="product-list">
          <tr><td colspan="5" style="text-align:center;">Cargando...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 2. Primero la conexión, después la lógica -->
  <script src="conexion.js"></script>
  <script src="app.js"></script>
</body>
</html>
