<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - Almacén</title>
  <link rel="stylesheet" href="style.css">

  <!-- Librería de Supabase: tiene que cargar ANTES que conexion.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="barra">
    <a class="marca" href="index.html">Almacén</a>
    <nav class="menu" aria-label="Secciones">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="clientes.html" aria-current="page">Clientes</a>
      <a href="ventas.html">Ventas</a>
      <a href="registros.html">Registros</a>
    </nav>
  </header>

  <main class="container">
    <h1>Clientes</h1>

    <!-- Mensajes de estado y errores -->
    <div id="mensaje" class="mensaje" hidden></div>

    <section class="card">
      <h2 id="form-title">Agregar cliente</h2>

      <form id="cliente-form">
        <input type="hidden" id="cliente-id">

        <div class="form-grid">
          <label>Nombre
            <input type="text" id="nombre" required autocomplete="off">
          </label>
          <label>Teléfono
            <input type="tel" id="telefono" autocomplete="off" placeholder="Ej: 11 1234-5678">
          </label>
        </div>

        <div class="botones">
          <button type="submit" id="btn-submit">Guardar cliente</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <h2>Lista de clientes</h2>

    <div class="herramientas">
      <input type="search" id="buscador" class="buscador" placeholder="Buscar por nombre o teléfono..." autocomplete="off">
    </div>

    <div id="cliente-list" class="vista-tabla">
      <p class="vacio">Cargando...</p>
    </div>
  </main>

  <!-- Primero la conexión, después la lógica -->
  <script src="conexion.js"></script>
  <script src="clientes.js"></script>
</body>
</html>
