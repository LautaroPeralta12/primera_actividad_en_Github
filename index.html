<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Almacén</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="container">
    <h1>🛒 Almacén - Control de Productos</h1>

    <!-- Formulario para agregar / editar producto -->
    <div class="card">
      <h2 id="form-title">Agregar Nuevo Producto</h2>
      <form id="product-form">
        <input type="hidden" id="product-id">
        <div class="form-grid">
          <input type="text" id="nombre" placeholder="Nombre del producto" required>
          <input type="number" id="precio" step="0.01" placeholder="Precio ($)" required>
          <input type="number" id="stock" placeholder="Cantidad en Stock" required>
          <input type="text" id="categoria" placeholder="Categoría (ej: Lácteos, Panadería)">
        </div>
        <button type="submit" id="btn-submit">Guardar Producto</button>
        <button type="button" id="btn-cancel" class="btn-cancel" style="display: none;" onclick="resetForm()">Cancelar</button>
      </form>
    </div>

    <!-- Lista de productos -->
    <div class="card">
      <h2>Inventario de Productos</h2>
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="product-list">
          <tr>
            <td colspan="5" style="text-align: center;">Cargando productos...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="conexion.js"></script>
  <script src="app.js"></script>
</body>
</html>
