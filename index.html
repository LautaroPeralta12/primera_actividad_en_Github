<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de Conexión Supabase (Sin RLS)</title>
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    #status {
      margin-top: 20px;
      padding: 10px;
      background-color: #f4f4f4;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>Prueba de Conexión Supabase</h2>

  <button onclick="testWrite()">1. Probar Escritura (INSERT)</button>
  <button onclick="testRead()">2. Probar Lectura (SELECT)</button>

  <div id="status">Haz clic en un botón para iniciar la prueba...</div>

  <script>
    // Configuración de credenciales
    const SUPABASE_URL = 'https://cgyuemfyzpqwgyvxkbmq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3UCGUuUDhugdtpHcZ1cnFg_bt7czoaL';

    // Inicializar cliente de Supabase
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const statusDiv = document.getElementById('status');

    // Función para probar escritura
    async function testWrite() {
      statusDiv.textContent = 'Enviando registro de prueba...';
      const testMessage = 'Registro de prueba creado el: ' + new Date().toLocaleString();

      const { data, error } = await supabaseClient
        .from('test_connection')
        .insert([{ message: testMessage }])
        .select();

      if (error) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = 'Error de escritura:\n' + JSON.stringify(error, null, 2);
      } else {
        statusDiv.style.color = 'green';
        statusDiv.textContent = '¡Escritura exitosa!\nRegistro insertado:\n' + JSON.stringify(data, null, 2);
      }
    }

    // Función para probar lectura
    async function testRead() {
      statusDiv.textContent = 'Consultando registros...';

      const { data, error } = await supabaseClient
        .from('test_connection')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(5);

      if (error) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = 'Error de lectura:\n' + JSON.stringify(error, null, 2);
      } else {
        statusDiv.style.color = 'green';
        statusDiv.textContent = '¡Lectura exitosa!\nÚltimos registros:\n' + JSON.stringify(data, null, 2);
      }
    }
  </script>

</body>
</html>
