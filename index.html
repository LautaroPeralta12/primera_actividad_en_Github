<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén - Productos</title>
  <link rel="stylesheet" href="style.css">

  <!-- Librería de Supabase: tiene que cargar ANTES que conexion.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <h1>Almacén</h1>

    <!-- Mensajes de estado y errores -->
    <div id="mensaje" class="mensaje" hidden></div>

    <section class="card">
      <h2 id="form-title">Agregar producto</h2>

      <form id="product-form">
        <input type="hidden" id="product-id">

        <div class="form-grid">
          <label>Código de barras
            <input type="text" id="codigo_barras" inputmode="numeric" autocomplete="off">
          </label>
          <label>Nombre
            <input type="text" id="nombre" required>
          </label>
          <label>Rubro
            <input type="text" id="rubro" list="lista-rubros" placeholder="Ej: Lácteos">
            <datalist id="lista-rubros"></datalist>
          </label>
          <label>Subrubro
            <input type="text" id="subrubro" placeholder="Ej: Leches">
          </label>
          <label>Precio
            <input type="number" id="precio" step="0.01" min="0" required>
          </label>
          <label>Cantidad
            <input type="number" id="stock" min="0" step="1" required>
          </label>
        </div>

        <div class="botones">
          <button type="submit" id="btn-submit">Guardar producto</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <h2>Productos</h2>

    <div class="herramientas">
      <input type="search" id="buscador" class="buscador" placeholder="Buscar por nombre o código de barras..." autocomplete="off">
      <select id="filtro-rubro" aria-label="Filtrar por rubro">
        <option value="">Todos los rubros</option>
      </select>
      <div class="vistas" role="group" aria-label="Tipo de vista">
        <button type="button" id="btn-vista-columnas" class="vista activo">Columnas</button>
        <button type="button" id="btn-vista-tabla" class="vista">Tabla</button>
      </div>
    </div>

    <!-- Acá se dibujan los productos -->
    <div id="product-list" class="categorias">
      <p class="vacio">Cargando...</p>
    </div>
  </main>

  <!-- Primero la conexión, después la lógica -->
  <script src="conexion.js"></script>
  <script src="app.js"></script>
</body>
</html>
