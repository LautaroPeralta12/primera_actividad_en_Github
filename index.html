<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Almacén - Productos</title>
  <link rel="stylesheet" href="style.css">

  <!-- Librería de Supabase: tiene que cargar ANTES que conexion.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <h1>Almacén</h1>

    <!-- Mensajes de estado y errores -->
    <div id="mensaje" class="mensaje" hidden></div>

    <section class="card">
      <h2 id="form-title">Agregar producto</h2>

      <form id="product-form">
        <input type="hidden" id="product-id">

        <div class="form-grid">
          <label>Nombre
            <input type="text" id="nombre" required>
          </label>
          <label>Categoría
            <input type="text" id="categoria" list="lista-categorias" placeholder="Ej: Lácteos">
            <datalist id="lista-categorias"></datalist>
          </label>
          <label>Precio
            <input type="number" id="precio" step="0.01" min="0" required>
          </label>
          <label>Stock
            <input type="number" id="stock" min="0" step="1" required>
          </label>
        </div>

        <div class="botones">
          <button type="submit" id="btn-submit">Guardar producto</button>
          <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
        </div>
      </form>
    </section>

    <h2>Productos por categoría</h2>

    <input type="search" id="buscador" class="buscador" placeholder="Buscar producto por nombre..." autocomplete="off">

    <!-- Acá se dibuja una columna por categoría -->
    <div id="product-list" class="categorias">
      <p class="vacio">Cargando...</p>
    </div>
  </main>

  <!-- Primero la conexión, después la lógica -->
  <script src="conexion.js"></script>
  <script src="app.js"></script>
</body>
</html>
